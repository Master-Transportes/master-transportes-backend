name: master-transporte

services:
  postgres:
    image: postgres:18
    container_name: mt_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    command:
      - postgres
      - -c
      - timezone=UTC
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER é obrigatório}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatório}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB é obrigatório}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - master-transporte-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  nsqd:
    image: nsqio/nsq:v1.3.0
    container_name: mt_nsqd
    restart: unless-stopped
    command:
      - /nsqd
      - --data-path=/data
      - --mem-queue-size=0
    ports:
      - "127.0.0.1:${NSQD_HTTP_PORT:-4151}:4151"
    expose:
      - "4150"
    volumes:
      - nsq_data:/data
    networks:
      - master-transporte-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4151/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: mt_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - master-transporte-network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

networks:
  master-transporte-network:
    name: master-transporte-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nsq_data:
